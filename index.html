<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Save Contact</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background: white;
    }

    .logo {
      width: 220px;
      margin-bottom: 20px;
    }

    .icon {
      width: 90px; /* half of 180px */
      margin: 20px auto;
      display: block;
    }

    .button {
      display: inline-block;
      padding: 15px 25px;
      font-size: 18px;
      color: white;
      background-color: #007bff;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
    }

    .button:hover {
      background-color: #0056b3;
    }

    .instructions {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- TOP LOGO -->
  <img class="logo" src="lurie_logo.png" alt="Lurie Logo">

  <!-- MAIN ICON -->
  <img class="icon" src="caring_contacts_logo.jpg" alt="Contact Icon">

  <p class="instructions">
    Tap below, SCROLL DOWN, and<br>
    click "Save New Contact"
  </p>

  <a class="button" href="contact.vcf" download>
    Save Contact
  </a>

</body>
</html>
