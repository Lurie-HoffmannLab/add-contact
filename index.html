<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Save Contact</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(220px, 60vw);
      margin-bottom: 10px;
    }

    .icon {
      width: min(90px, 25vw);
      margin: 10px 0 15px 0;
      display: block;
    }

    .instructions {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.4;
      margin: 10px 0 20px 0;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      font-size: 18px;
      color: white;
      background-color: #007bff;
      text-decoration: none;
      border-radius: 10px;
      width: min(260px, 80%);
    }

    .button:hover {
      background-color: #0056b3;
    }

    /* Mobile fine-tuning */
    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .instructions {
        font-size: 15px;
      }

      .button {
        font-size: 17px;
        padding: 16px 20px;
      }
    }
  </style>
</head>

<body>

  <img class="logo" src="lurie_logo.png" alt="Lurie Logo">

  <img class="icon" src="caring_contacts_logo.jpg" alt="Contact Icon">

  <p class="instructions">
    Tap below, SCROLL DOWN, and<br>
    <strong>click "Save New Contact"</strong>
  </p>

  <a class="button"
     href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0APRODID%3A-//Apple%20Inc.//macOS%2026.5//EN%0AN%3AContacts%3BCaring%3B%3B%3B%0AFN%3ACaring%20Contacts%0ATEL%3Btype%3DCELL%3Btype%3DVOICE%3Btype%3Dpref%3A773-377-5993%0APHOTO%3BVALUE%3DURI%3Ahttps%3A%2F%2FLurie-HoffmannLab.github.io%2Fadd-contact%2Fcaring_contacts_logo.jpg%0ANOTE%3ATexts%20sent%20from%20your%20Lurie%20Children%27s%20Emergency%20Care%20Team.%20%F0%9F%AB%B6%5Cn%5CnIf%20you%27d%20like%20to%20talk%2C%20you%20can%20always%20call%20or%20text%20988%20to%20speak%20with%20Crisis%20Lifeline%20counselors%2C%20or%20you%20can%20call%20the%20Illinois%20CARES%20hotline%20at%201-800-345-9049.%20%F0%9F%92%99%5Cn%5CnIf%20you%E2%80%99d%20like%20to%20change%20the%20time%20of%20day%20you%20receive%20these%20texts%2C%20or%20if%20you%20don%E2%80%99t%20want%20to%20receive%20future%20texts%2C%20email%20HoffmannLab%40luriechildrens.org.%5Cn%5CnRemember%2C%20you%20matter.">
    Save Contact
  </a>

</body>
</html>
