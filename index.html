<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Save Contact</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(220px, 60vw);
      margin-bottom: 10px;
    }

    .icon {
      width: min(90px, 25vw);
      margin: 10px 0 15px 0;
      display: block;
    }

    .instructions {
      font-weight: bold;
      font-size: 16px;
      line-height: 1.4;
      margin: 10px 0 20px 0;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      font-size: 18px;
      color: white;
      background-color: #007bff;
      text-decoration: none;
      border-radius: 10px;
      width: min(260px, 80%);
    }

    .button:hover {
      background-color: #0056b3;
    }

    /* Mobile fine-tuning */
    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .instructions {
        font-size: 15px;
      }

      .button {
        font-size: 17px;
        padding: 16px 20px;
      }
    }
  </style>
</head>

<body>

  <img class="logo" src="lurie_logo.png" alt="Lurie Logo">

  <img class="icon" src="caring_contacts_logo.jpg" alt="Contact Icon">

  <p class="instructions">
    Tap below, SCROLL DOWN, and<br>
    <strong>click "Save New Contact"</strong>
  </p>

  <a class="button" href="contact.vcf" download>
    Save Contact
  </a>

</body>
</html>
